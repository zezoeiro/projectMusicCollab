<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home Page</title>
</head>
  <body class="h-full text-gray-200">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col p-4">
        <div class="flex items-center gap-2 mb-8">
          <div class="w-8 h-8 bg-blue-500 rounded-full"></div>
        </div>

        <nav class="flex-1">
          <ul class="space-y-2">
            <li>
              <a href="#" class="flex items-center gap-3 p-2 rounded-lg bg-gray-800">
                <span>🏠</span> Dashboard
              </a>
            </li>
            <li><a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-800">👥 Team</a></li>
            <li><a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-800">🗂 Projects</a></li>
            <li><a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-800">📅 Calendar</a></li>
            <li><a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-800">📄 Documents</a></li>
            <li><a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-800">📊 Reports</a></li>
          </ul>

          

          
        </nav>

        <a href="#" class="mt-auto flex items-center gap-3 p-2 rounded-lg hover:bg-gray-800 text-gray-400">⚙️ Settings</a>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-6">
        <div class="flex justify-between items-center">
          <input
            type="text"
            placeholder="Search"
            class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-lg w-64 focus:outline-none focus:ring-2 focus:ring-blue-600"
          />

          <div class="flex items-center gap-6">
            <button class="text-xl">🔔</button>
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-gray-700"></div>
              <span class="text-sm font-medium">Tom Cook</span>
            </div>
          </div>
        </div>

        <div class="mt-6 border border-gray-700 rounded-lg h-full bg-[repeating-linear-gradient(45deg,#111_0px,#111_10px,#161616_10px,#161616_20px)]"></div>
      </main>
    </div>
  </body>
</html>
