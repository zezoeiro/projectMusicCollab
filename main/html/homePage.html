<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home Page</title>
</head>
<body class="h-screen overflow-hidden text-gray-200 bg-[#000]">
  <div class="flex h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#0a0a0a] border-r border-[#1f1f1f] flex flex-col p-4">
      <div class="flex items-center gap-2 mb-8">
        <div class="w-8 h-8 bg-[#1DB954] rounded-full shadow-[0_0_10px_#1DB954]"></div>
      </div>

      <nav class="flex-1">
        <ul class="space-y-2">

          <li>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg bg-[#1f1f1f] text-[#1DB954] font-semibold">
              <span>🏠</span> Dashboard
            </a>
          </li>

          <li>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#1a1a1a] hover:text-[#1DB954] transition">
              👥 Team
            </a>
          </li>

          <li>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#1a1a1a] hover:text-[#1DB954] transition">
              🗂 Projects
            </a>
          </li>

          <li>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#1a1a1a] hover:text-[#1DB954] transition">
              📅 Calendar
            </a>
          </li>

          <li>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#1a1a1a] hover:text-[#1DB954] transition">
              📄 Documents
            </a>
          </li>

          <li>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#1a1a1a] hover:text-[#1DB954] transition">
              📊 Reports
            </a>
          </li>

        </ul>
      </nav>

      <a href="#" class="mt-auto flex items-center gap-3 p-2 rounded-lg hover:bg-[#1a1a1a] hover:text-[#1DB954] text-gray-400 transition">
        ⚙️ Settings
      </a>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 h-full overflow-hidden">

      <div class="flex justify-between items-center">

        <input
          type="text"
          placeholder="Search"
          class="bg-[#1a1a1a] border border-[#2a2a2a] px-4 py-2 rounded-lg w-64 focus:outline-none focus:ring-2 focus:ring-[#1DB954]"
        />

        <div class="flex items-center gap-6">
         
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-[#1f1f1f]"></div>
            <span class="text-sm font-medium">Tom Cook</span>
          </div>
        </div>

      </div>

      <div class="mt-6 border border-[#1f1f1f] rounded-lg h-full bg-[repeating-linear-gradient(45deg,#000_0px,#000_10px,#0a0a0a_10px,#0a0a0a_20px)]"></div>
    </main>

  </div>
</body>
</html>
